<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador · Cambios formulario Terceros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#141b33; --navy2:#1d2748; --accent:#6d4aff; --accent-dark:#5637d1;
    --bg:#f3f4f8; --card:#ffffff; --border:#e2e4ec; --text:#171a26; --muted:#6b7080;
    --green:#0e7a4c; --green-bg:#e7f7ef; --red:#b3261e; --red-bg:#fdecec;
    --amber:#8a5a00; --amber-bg:#fff6e5; --blue:#1f5bd6; --blue-bg:#eaf0ff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);}
  .mono{font-family:'JetBrains Mono',monospace;}
  header.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px 28px;}
  header.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px;}
  header.top p{margin:6px 0 0;font-size:13px;color:#b8bfe0;}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}

  .tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
  .tab-btn{
    font-family:inherit;font-size:13.5px;font-weight:700;border-radius:10px;border:1px solid var(--border);
    background:#fff;color:var(--muted);padding:12px 18px;cursor:pointer;transition:.15s;
  }
  .tab-btn .n{
    display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
    background:#e7e8ef;color:#565a6c;font-size:11px;margin-right:8px;
  }
  .tab-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .tab-btn.active .n{background:var(--accent);color:#fff;}
  .tab-btn:not(.active):hover{border-color:var(--accent);color:var(--accent-dark);}
  .tab-content{display:none;}
  .tab-content.active{display:block;}

  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start;}
  @media (max-width:900px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:0 1px 2px rgba(20,27,51,.04);margin-bottom:20px;}
  .card h2{font-size:15px;margin:0 0 16px;font-weight:700;}
  .card h2 .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.4px;background:#eee9ff;color:var(--accent-dark);border-radius:5px;padding:2px 7px;margin-left:8px;vertical-align:middle;}
  label{display:block;font-size:12.5px;font-weight:600;color:#3a3f52;margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  select,input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid #d7d9e4;border-radius:9px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;}
  select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #6d4aff22;}
  input:disabled,select:disabled{background:#f4f4f7;color:#9a9daa;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .field-conditional{border-left:3px solid var(--accent);background:#f8f7ff;border-radius:0 9px 9px 0;padding:2px 14px 14px;margin-top:14px;}
  .note-box{margin-top:14px;border-radius:9px;padding:12px 14px;font-size:12.5px;line-height:1.5;background:var(--amber-bg);color:var(--amber);border:1px solid #f0dfae;}
  .note-box.info{background:var(--blue-bg);color:var(--blue);border-color:#c9d9ff;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .btnbar{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  button{font-family:inherit;font-size:13.5px;font-weight:600;border-radius:9px;border:1px solid transparent;padding:11px 16px;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .btn-ghost{background:#fff;border-color:#d7d9e4;color:#3a3f52;}
  .btn-ghost:hover{background:#f4f4f8;}
  .btn-small{padding:7px 11px;font-size:12px;}
  .preview-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .preview-row:last-child{border-bottom:none;}
  .preview-row .lbl{color:var(--muted);}
  .preview-row .val{font-weight:700;}
  .preview-total{margin-top:10px;background:#f8f7ff;border:1px solid #e4defe;border-radius:9px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;}
  .preview-total .val{color:var(--accent-dark);font-size:16px;font-weight:800;}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;}
  .badge-green{background:var(--green-bg);color:var(--green);}
  .badge-red{background:var(--red-bg);color:var(--red);}
  .badge-amber{background:var(--amber-bg);color:var(--amber);}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:34px 0 14px;}
  .section-title h2{font-size:16px;margin:0;}
  .empty-log{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;border:1px dashed var(--border);border-radius:12px;}
  .log-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;}
  .log-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .log-head .titlebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .log-head .num{background:var(--navy);color:#fff;font-weight:700;font-size:12px;border-radius:7px;padding:4px 9px;}
  .log-head .metodo{font-weight:700;font-size:14.5px;}
  .log-head .monto{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--accent-dark);}
  .log-head .del{background:none;border:none;color:#b3261e;font-size:12px;cursor:pointer;padding:4px 6px;}
  .log-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .log-grid-full{margin-bottom:14px;}
  .log-grid-full .estado-table{max-width:520px;}
  .box{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#fafafe;}
  .box h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  .kv .a{color:var(--muted);}
  .commission-box{background:#f8f7ff;border:1px solid #e4defe;}
  .commission-box .kv .v{font-weight:700;color:var(--accent-dark);}
  .estado-box{background:#f2f6ff;border:1px solid #d7e2ff;}
  .estado-table{width:100%;border-collapse:collapse;font-size:13px;}
  .estado-table th{text-align:right;font-size:11px;color:var(--muted);font-weight:600;padding:4px 6px;}
  .estado-table th:first-child{text-align:left;}
  .estado-table td{text-align:right;padding:5px 6px;font-family:'JetBrains Mono',monospace;font-weight:600;}
  .estado-table td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:600;color:var(--muted);}
  .estado-table tr:not(:last-child) td, .estado-table tr:not(:last-child) th{border-bottom:1px solid #dbe4fb;}
  .setup-table{width:100%;border-collapse:collapse;font-size:13px;}
  .setup-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border);}
  .setup-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .setup-table input[type=text]{width:110px;padding:6px 8px;font-size:13px;}
  .setup-table tr.row-new td{background:var(--green-bg);}
  .tt-list{display:flex;flex-direction:column;gap:8px;}
  .tt-list label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text);margin:0;}
  .tt-list input[type=checkbox]{width:auto;accent-color:var(--green);}
  .setup-note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .estado-live{display:flex;flex-direction:column;gap:6px;margin-top:14px;background:#f2f6ff;border:1px solid #d7e2ff;border-radius:10px;padding:12px 14px;}
  .estado-live .kv{font-size:13.5px;}

  /* Tab1 comparison lists */
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:700px){.cmp{grid-template-columns:1fr;}}
  .cmp-col h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);}
  .cmp-col ul{margin:0;padding-left:0;list-style:none;}
  .cmp-col li{padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:13.5px;background:#fafafe;}
  .cmp-col li.new{background:var(--green-bg);border-color:#bfe6d3;color:var(--green);font-weight:700;}

  /* Tab2 formulario en 2 columnas */
  .two-col-form{display:grid;grid-template-columns:1fr 1fr;gap:0;}
  @media (max-width:800px){.two-col-form{grid-template-columns:1fr;}}
  .form-col{padding:4px 24px;}
  .form-col.left{border-right:1px solid var(--border);}
  @media (max-width:800px){.form-col.left{border-right:none;border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:10px;}}
  .form-col h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:0 0 14px;font-weight:700;}
  .radio-group{display:flex;gap:18px;margin-top:16px;font-size:13.5px;align-items:center;}
  .radio-group label{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--text);margin:0;}
  .disp-stack{border:1px solid var(--border);border-radius:12px;padding:6px 16px;background:#fafafe;}
  .disp-row{
    display:grid;grid-template-columns:150px 1fr 64px;grid-template-rows:auto auto;
    column-gap:14px;row-gap:3px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);
  }
  .disp-row:last-child{border-bottom:none;}
  .disp-row-label{grid-column:1;grid-row:1 / span 2;font-size:13px;font-weight:600;color:#3a3f52;}
  .disp-slider{grid-column:2;grid-row:1;
    -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:4px;
    background:linear-gradient(to right, var(--accent) 0%, var(--accent) var(--pct,25%), #e2e4ec var(--pct,25%), #e2e4ec 100%);
    outline:none;padding:0;
  }
  .disp-slider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .disp-slider::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .disp-ticks{grid-column:2;grid-row:2;display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);padding:0 2px;}
  .disp-value-chip{grid-column:3;grid-row:1 / span 2;
    background:#eee9ff;color:var(--accent-dark);font-weight:800;font-size:13px;border-radius:8px;
    padding:6px 8px;text-align:center;font-family:'JetBrains Mono',monospace;height:fit-content;
  }
  .disp-value-chip span{font-weight:600;font-size:10px;opacity:.75;margin-left:2px;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,27,51,.55);
    align-items:flex-start;justify-content:center;z-index:1000;padding:24px 20px;
    overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff;border-radius:16px;padding:28px 26px;max-width:420px;width:100%;
    text-align:center;box-shadow:0 20px 50px rgba(20,27,51,.3);
    max-height:90vh;overflow-y:auto;margin:auto;
  }
  .modal-icon{font-size:34px;margin-bottom:6px;}
  .modal-box h3{margin:0 0 12px;font-size:17px;}
  .modal-box p{font-size:14px;line-height:1.6;color:#3a3f52;margin:0 0 20px;}
  .modal-box p strong{color:var(--accent-dark);}

  .segmented{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .segmented-btn{flex:1;padding:11px 16px;border:none;background:#fff;color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .segmented-btn.active{background:var(--accent);color:#fff;}
  .segmented-btn:not(.active):hover{background:#f4f4f8;}

  .tercero-list{margin-top:10px;border:1px solid var(--border);border-radius:10px;max-height:260px;overflow-y:auto;}
  .tercero-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s;}
  .tercero-row:last-child{border-bottom:none;}
  .tercero-row:hover{background:#f8f7ff;}
  .tercero-row.selected{background:#eee9ff;}
  .tercero-row.tercero-disabled{cursor:not-allowed;opacity:.5;background:#f4f4f7;}
  .tercero-row.tercero-disabled:hover{background:#f4f4f7;}
  .tercero-row .nom{font-size:13.5px;font-weight:600;}
  .tercero-row .meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .tercero-row .elig{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;}
  .tercero-empty{padding:16px;text-align:center;font-size:12.5px;color:var(--muted);}

  .pos-modal{border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#fff;box-shadow:0 1px 2px rgba(20,27,51,.04);margin-bottom:20px;max-height:90vh;display:flex;flex-direction:column;}
  .pos-form-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;}
  @media (max-width:800px){.pos-form-cols{grid-template-columns:1fr;}}
  .pos-modal-bar{background:var(--navy);color:#fff;padding:16px 22px;font-size:14px;font-weight:700;letter-spacing:.3px;flex-shrink:0;}
  .pos-modal-body{padding:22px;flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:hidden;}
  .pos-modal-fixed-top{flex-shrink:0;}
  #terceroPickerWrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:hidden;}
  #terceroPickerWrap .tercero-list{flex:1;min-height:70px;}
  #terceroWarning{flex-shrink:0;}
  .pos-config-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:800px){.pos-config-row{grid-template-columns:1fr 1fr;}}
  .pos-estado-strip{
    display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px;
    background:var(--navy2);color:#fff;border-radius:12px;padding:16px 20px;margin:18px 0;
  }
  .pos-estado-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:#b8bfe0;}
  .pos-estado-item strong{font-size:17px;color:#fff;font-family:'JetBrains Mono',monospace;}
  .pos-modal-footer{display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;padding:16px 22px;border-top:1px solid var(--border);background:#fff;}
  .pos-modal-footer.space-between{justify-content:space-between;}
  .pos-modal-bar{display:flex;justify-content:space-between;align-items:center;}
  .pos-modal-close{cursor:pointer;opacity:.8;}

  .resumen-cards{display:flex;gap:14px;flex-wrap:wrap;}
  .resumen-card{
    display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;
    padding:14px 20px;flex:1;min-width:180px;background:#fafafe;
  }
  .resumen-icon{font-size:22px;}
  .resumen-label{font-size:12px;color:var(--muted);}
  .resumen-value{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;}

  .categoria-pills{display:flex;gap:10px;flex-wrap:wrap;}
  .pill-btn{
    border:1.5px solid var(--border);background:#fff;color:var(--text);border-radius:999px;
    padding:10px 22px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .pill-btn.active{border-color:var(--accent);color:var(--accent-dark);background:#f4f2ff;}
  .pill-btn:not(.active):hover{border-color:var(--accent);}

  .segmented.full .segmented-btn{padding:14px 16px;font-size:14px;}
  .cantidad-grande{font-size:22px;font-weight:800;padding:12px 14px;}
  .btn-primary-blue{background:var(--blue);color:#fff;font-family:inherit;font-size:13.5px;font-weight:700;border-radius:9px;border:none;padding:11px 20px;cursor:pointer;}
  .btn-primary-blue:hover{opacity:.9;}
  .btn-dark-small{background:var(--navy);color:#fff;border:none;padding:7px 14px;font-size:12px;font-weight:700;border-radius:9px;cursor:pointer;}
  .btn-dark-small:hover{opacity:.9;}
  .btn-blue-small{background:var(--blue);color:#fff;border:none;padding:7px 14px;font-size:12px;font-weight:700;border-radius:9px;cursor:pointer;}
  .btn-blue-small:hover{opacity:.9;}
  .btn-whatsapp-small{background:#25D366;color:#fff;border:none;padding:5px 12px;font-size:11.5px;font-weight:700;border-radius:8px;cursor:pointer;}
  .btn-whatsapp-small:hover{opacity:.9;}

  .dash-title{font-size:17px;font-weight:700;margin:0;color:var(--text);}
  .resumen-icon.ic-yellow{background:#fde68a;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .resumen-icon.ic-orange{background:#fed7aa;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .resumen-icon.ic-green{background:#bbf7d0;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;}

  .mov-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px;}
  .mov-table th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--border);}
  .mov-table td{padding:12px 8px;border-bottom:1px solid var(--border);}
  .mov-table .mov-eliminar{
    background:#fff;border:1px solid #f3b9b4;color:var(--red);border-radius:8px;padding:6px 12px;
    font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .mov-filtros{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;font-size:13px;}
  .mov-filtros-label{font-weight:700;color:var(--text);white-space:nowrap;}
  .mov-filtros select, .mov-filtros input{width:auto;padding:8px 10px;font-size:13px;}
  .mov-footer-bar{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    background:var(--navy2);color:#fff;border-radius:12px;padding:14px 20px;margin-top:18px;font-size:13px;
  }
  .mov-footer-pag strong{background:#ffffff22;padding:3px 10px;border-radius:6px;}
  .mini-desglose{padding:2px 0 8px 14px;}
  .mini-desglose .fila{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 0;}
  .mini-desglose .fila span:last-child{font-family:'JetBrains Mono',monospace;}

  .sc-topbar{background:#f3f4f6;border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px;}
  .sc-hamburger{width:36px;height:36px;border-radius:8px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .sc-corresponsal{display:flex;flex-direction:column;gap:2px;}
  .sc-corresponsal label{font-size:10.5px;color:var(--muted);}
  .sc-corresponsal select{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;}
  .sc-compartir{display:flex;align-items:center;gap:6px;color:var(--blue);font-weight:700;font-size:13px;}
  .sc-title{font-weight:800;font-size:14.5px;color:var(--text);white-space:nowrap;}
  .sc-icons{display:flex;gap:10px;align-items:center;}
  .sc-icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;border:1px solid var(--border);background:#fff;}
  .sc-icon-btn.sc-icon-dark{background:#111827;color:#fff;border-color:#111827;}
  .sc-icon-btn.sc-icon-green{background:#e6f7ec;color:var(--green);border-color:#bff0d2;}
  .sc-refresh{width:34px;height:34px;border-radius:50%;border:2px solid #f59e0b;color:#f59e0b;display:flex;align-items:center;justify-content:center;background:#fff;}
  .sc-frame{border:1px solid var(--border);border-radius:16px;padding:20px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:20px;}
  .sc-icon-wrap{position:relative;display:inline-flex;}
  .sc-icon-wrap .sc-tooltip{
